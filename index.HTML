<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Tools Hub</title>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f4f7fb;
      color:#222;
    }
    header{
      background:#172554;
      color:white;
      padding:25px 15px;
      text-align:center;
    }
    header h1{margin:0 0 8px}
    header p{margin:0}
    .container{
      max-width:900px;
      margin:auto;
      padding:20px;
    }
    .tools{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:15px;
    }
    .card{
      background:white;
      padding:20px;
      border-radius:15px;
      box-shadow:0 3px 12px #0001;
    }
    input,button{
      width:100%;
      padding:12px;
      margin-top:8px;
      border-radius:8px;
      border:1px solid #ccc;
      font-size:16px;
    }
    button{
      background:#172554;
      color:white;
      border:0;
      cursor:pointer;
    }
    button:hover{background:#243b80}
    .result{
      margin-top:10px;
      font-weight:bold;
    }
    .ad-box{
      margin:20px 0;
      padding:25px;
      text-align:center;
      background:#fff;
      border:1px dashed #aaa;
      border-radius:10px;
      color:#777;
    }
    footer{
      margin-top:30px;
      padding:20px;
      background:#172554;
      color:white;
      text-align:center;
    }
  </style>
</head>

<body>

<header>
  <h1>🎓 Student Tools Hub</h1>
  <p>Free useful tools for students</p>
</header>

<div class="container">

  <div class="ad-box">
    Advertisement Space
  </div>

  <div class="tools">

    <div class="card">
      <h2>📊 Percentage Calculator</h2>

      <input id="marks" type="number" placeholder="Obtained marks">
      <input id="total" type="number" placeholder="Total marks">

      <button onclick="percentage()">Calculate</button>

      <div id="percentageResult" class="result"></div>
    </div>

    <div class="card">
      <h2>🎂 Age Calculator</h2>

      <input id="dob" type="date">

      <button onclick="age()">Calculate Age</button>

      <div id="ageResult" class="result"></div>
    </div>

    <div class="card">
      <h2>📏 Kilometre to Metre</h2>

      <input id="km" type="number" placeholder="Enter kilometres">

      <button onclick="convertKm()">Convert</button>

      <div id="kmResult" class="result"></div>
    </div>

    <div class="card">
      <h2>💰 Simple Discount</h2>

      <input id="price" type="number" placeholder="Original price">
      <input id="discount" type="number" placeholder="Discount %">

      <button onclick="discount()">Calculate</button>

      <div id="discountResult" class="result"></div>
    </div>

  </div>

  <div class="ad-box">
    Advertisement Space
  </div>

  <div class="card">
    <h2>📚 Study Resources</h2>
    <p>Useful study guides, calculators and student resources will be added here.</p>
  </div>

</div>

<footer>
  © 2026 Student Tools Hub
</footer>

<script>

function percentage(){
  let marks = Number(document.getElementById("marks").value);
  let total = Number(document.getElementById("total").value);

  if(total <= 0){
    document.getElementById("percentageResult").innerText =
    "Please enter valid marks.";
    return;
  }

  let result = (marks / total) * 100;

  document.getElementById("percentageResult").innerText =
  "Percentage: " + result.toFixed(2) + "%";
}

function age(){
  let dob = new Date(document.getElementById("dob").value);

  if(isNaN(dob)){
    document.getElementById("ageResult").innerText =
    "Please select your date of birth.";
    return;
  }

  let today = new Date();

  let years = today.getFullYear() - dob.getFullYear();
  let month = today.getMonth() - dob.getMonth();

  if(
    month < 0 ||
    (month === 0 && today.getDate() < dob.getDate())
  ){
    years--;
  }

  document.getElementById("ageResult").innerText =
  "Your age: " + years + " years";
}

function convertKm(){
  let km = Number(document.getElementById("km").value);

  document.getElementById("kmResult").innerText =
  "Metres: " + (km * 1000);
}

function discount(){
  let price = Number(document.getElementById("price").value);
  let dis = Number(document.getElementById("discount").value);

  let saved = price * dis / 100;
  let finalPrice = price - saved;

  document.getElementById("discountResult").innerText =
  "Final price: ₹" + finalPrice.toFixed(2);
}

</script>

</body>
</html>
